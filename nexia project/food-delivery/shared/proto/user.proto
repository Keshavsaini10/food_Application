syntax = "proto3";

package user;

// ─────────────────────────────────────────────
//  User gRPC Service
//  Used by: Order Service (address lookup)
// ─────────────────────────────────────────────

service UserService {
  rpc GetUser (GetUserRequest) returns (UserResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
}

message GetUserRequest {
  string user_id = 1;
}

message ValidateTokenRequest {
  string token = 1;
}

message UserResponse {
  string id           = 1;
  string name         = 2;
  string email        = 3;
  string phone        = 4;
  string address      = 5;
  double wallet_balance = 6;
}

message ValidateTokenResponse {
  bool   valid   = 1;
  string user_id = 2;
  string email   = 3;
  string role    = 4;
}
