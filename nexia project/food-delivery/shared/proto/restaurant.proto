syntax = "proto3";

package restaurant;

// ─────────────────────────────────────────────
//  Restaurant gRPC Service
//  Used by: Order Service (pricing, validation)
// ─────────────────────────────────────────────

service RestaurantService {
  rpc GetMenuItem (GetMenuItemRequest) returns (MenuItemResponse);
  rpc GetMenuItems (GetMenuItemsRequest) returns (MenuItemsResponse);
  rpc ValidateOrder (ValidateOrderRequest) returns (ValidateOrderResponse);
  rpc GetRestaurant (GetRestaurantRequest) returns (RestaurantResponse);
}

// ── Requests ─────────────────────────────────

message GetMenuItemRequest {
  string menu_item_id = 1;
}

message GetMenuItemsRequest {
  repeated string menu_item_ids = 1;
}

message ValidateOrderRequest {
  string restaurant_id = 1;
  repeated OrderItemInput items = 2;
}

message GetRestaurantRequest {
  string restaurant_id = 1;
}

// ── Order item input ──────────────────────────

message OrderItemInput {
  string menu_item_id = 1;
  int32  quantity      = 2;
}

// ── Responses ────────────────────────────────

message MenuItemResponse {
  string  id          = 1;
  string  name        = 2;
  double  price       = 3;
  string  description = 4;
  bool    available   = 5;
  string  category    = 6;
}

message MenuItemsResponse {
  repeated MenuItemResponse items = 1;
}

message ValidateOrderResponse {
  bool   valid         = 1;
  string message       = 2;
  double total_price   = 3;
  repeated OrderItemPriced priced_items = 4;
}

message OrderItemPriced {
  string menu_item_id = 1;
  string name         = 2;
  int32  quantity     = 3;
  double unit_price   = 4;
  double subtotal     = 5;
}

message RestaurantResponse {
  string id           = 1;
  string name         = 2;
  string address      = 3;
  bool   is_open      = 4;
  string cuisine_type = 5;
  double rating       = 6;
}
