apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
    spec:
      containers:
        - name: user-service
          image: food-delivery/user-service:latest
          ports:
            - containerPort: 3001
              name: http
            - containerPort: 50051
              name: grpc
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: GRPC_PORT
              value: "50051"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: food-secrets
                  key: mongodb-uri-users
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: food-secrets
                  key: jwt-secret
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: food-secrets
                  key: rabbitmq-url
            - name: JAEGER_ENDPOINT
              value: "http://jaeger:14268/api/traces"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001
    - name: grpc
      port: 50051
      targetPort: 50051
  type: ClusterIP
