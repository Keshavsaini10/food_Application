# ═══════════════════════════════════════════════════════════════
#  Food Delivery Platform — Docker Compose
#  Services: MongoDB, RabbitMQ, Jaeger, Kong, 6× NestJS services
# ═══════════════════════════════════════════════════════════════

version: '3.9'

networks:
  food-net:
    driver: bridge

volumes:
  mongo-data:
  rabbitmq-data:
  kong-data:

# ── Shared environment variables ─────────────────────────────
x-common-env: &common-env
  NODE_ENV: production
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  JWT_SECRET: super_secret_jwt_key_change_in_prod
  JWT_EXPIRES_IN: 7d
  JAEGER_ENDPOINT: http://jaeger:14268/api/traces

services:

  # ── Infrastructure ───────────────────────────────────────────

  mongodb:
    image: mongo:7.0
    container_name: food-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - food-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0
    container_name: food-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - food-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: food-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - food-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: food-jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"   # Jaeger UI
      - "14268:14268"   # HTTP collector
      - "9411:9411"
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: "9411"
    networks:
      - food-net

  # ── Kong API Gateway ─────────────────────────────────────────

  kong-migrate:
    image: kong:3.6-ubuntu
    container_name: food-kong-migrate
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: "off"
    networks:
      - food-net

  kong:
    image: kong:3.6-ubuntu
    container_name: food-kong
    ports:
      - "8000:8000"   # Proxy (client traffic)
      - "8443:8443"   # Proxy SSL
      - "8001:8001"   # Admin API
      - "8444:8444"   # Admin SSL
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      - user-service
      - restaurant-service
      - order-service
      - payment-service
      - delivery-service
    networks:
      - food-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── NestJS Microservices ─────────────────────────────────────

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: food-user-service
    ports:
      - "3001:3001"
      - "50051:50051"
    environment:
      <<: *common-env
      PORT: 3001
      GRPC_PORT: 50051
      MONGODB_URI: mongodb://mongodb:27017/food_users
    depends_on:
      mongodb:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - food-net
    restart: on-failure

  restaurant-service:
    build:
      context: ./services/restaurant-service
      dockerfile: Dockerfile
    container_name: food-restaurant-service
    ports:
      - "3002:3002"
      - "50052:50052"
    environment:
      <<: *common-env
      PORT: 3002
      GRPC_PORT: 50052
      MONGODB_URI: mongodb://mongodb:27017/food_restaurants
    depends_on:
      mongodb:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - food-net
    restart: on-failure

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: food-order-service
    ports:
      - "3003:3003"
    environment:
      <<: *common-env
      PORT: 3003
      MONGODB_URI: mongodb://mongodb:27017/food_orders
      RESTAURANT_GRPC_URL: restaurant-service:50052
      USER_GRPC_URL: user-service:50051
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      restaurant-service:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - food-net
    restart: on-failure

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: food-payment-service
    ports:
      - "3004:3004"
    environment:
      <<: *common-env
      PORT: 3004
      MONGODB_URI: mongodb://mongodb:27017/food_payments
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-net
    restart: on-failure

  delivery-service:
    build:
      context: ./services/delivery-service
      dockerfile: Dockerfile
    container_name: food-delivery-service
    ports:
      - "3005:3005"
    environment:
      <<: *common-env
      PORT: 3005
      MONGODB_URI: mongodb://mongodb:27017/food_deliveries
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-net
    restart: on-failure

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: food-notification-service
    ports:
      - "3006:3006"
    environment:
      <<: *common-env
      PORT: 3006
      MONGODB_URI: mongodb://mongodb:27017/food_notifications
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-net
    restart: on-failure
